default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

stages:
  - lint
  - depends
  - build
  - test
  - staple
  - installer
  - package

sast:
  stage: test
  before_script:
    - if [[ "$IGNORE_SECURITY" == "true" ]]; then exit 0; fi
  tags:
    - k8s
  variables:
    SAST_EXCLUDED_ANALYZERS: "semgrep"

.build:
  stage: build
  script:
    - export GREEN_ENV=$([[ $CI_COMMIT_REF_NAME = release_* ]] && echo "Production" || echo "Testing")
    - export GREEN_BUILD_ID=$([[ $CI_COMMIT_REF_NAME = release_* ]] && echo "" || echo "-$CI_COMMIT_SHORT_SHA")
    - qt-cmake --preset ci
    - cmake --build build --parallel 4
    - curl -sL https://sentry.io/get-cli | INSTALL_DIR=$PWD sh
    - |
      ./sentry-cli --url https://sentry.blockstream.io debug-files upload \
        --org $SENTRY_ORG \
        --project $SENTRY_PROJECT \
        --auth-token=$SENTRY_AUTH_TOKEN \
        --log-level=$SENTRY_LOG_LEVEL build

include:
  - local: ci/docker.yaml
  - local: ci/lint.yml
  - local: ci/linux-x86_64.yml
  - local: ci/macos.yml
  - local: ci/macos-arm64.yml
  - local: ci/macos-x86_64.yml
  - local: ci/macos-universal.yml
  - local: ci/windows-x86_64.yml
  - local: ci/package.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
