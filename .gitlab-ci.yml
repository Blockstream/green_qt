default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure

# Required project/group CI variables (values are configuration, not credentials):
# GAR, GAR_SERVICE_ACCOUNT_EMAIL, UPDATE_SERVER_SERVICE_ACCOUNT_EMAIL.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

stages:
  - lint
  - depends
  - build
  - test
  - staple
  - installer
  - package

sast:
  stage: test
  before_script:
    - if [[ "$IGNORE_SECURITY" == "true" ]]; then exit 0; fi
  tags:
    - k8s
  variables:
    SAST_EXCLUDED_ANALYZERS: "semgrep"

.build:
  stage: build
  script:
    - tools/ci/build.sh
    - tools/ci/sentry-upload.sh

include:
  - component: $CI_SERVER_FQDN/infrastructure/devops/gitlab-components/gcp-wif-auth/gcp-auth@0.0.3
    inputs:
      service_account_email: $GAR_SERVICE_ACCOUNT_EMAIL
      disable_auth_job: true
  - local: ci/docker.yaml
  - local: ci/lint.yml
  - local: ci/linux-x86_64.yml
  - local: ci/macos.yml
  - local: ci/macos-arm64.yml
  - local: ci/macos-x86_64.yml
  - local: ci/macos-universal.yml
  - local: ci/windows-x86_64.yml
  - local: ci/package.yml
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml
