linux-x86_64:build-image:
  extends: .docker_build
  variables:
    IMAGE: $GAR/green_qt/linux-x86_64
    DOCKER_FILE: ci/linux-x86_64/Dockerfile
    DOCKER_BUILD_ARGS: --build-arg QT_INSTALLER_JWT_TOKEN=${QT_INSTALLER_JWT_TOKEN}

.linux-x86_64:
  extends: .gar_wif
  tags:
    - cloud
  variables:
    LINUX_IMAGE: $GAR/green_qt/linux-x86_64@sha256:7ab2f2ed827e9247de0e36b43476ccaf15be3f9c59b8b44137852c8407f1860a

linux-x86_64:test:
  stage: test
  extends:
    - .linux-x86_64
  rules:
    - when: never
  needs:
    - job: linux-x86_64:build-appimage
      artifacts: false
  variables:
    CTEST_JUNIT_FILE: "$CI_PROJECT_DIR/build/ctest-junit.xml"
  script:
    - docker pull "$LINUX_IMAGE"
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      -e CI_COMMIT_REF_NAME
      -e CI_COMMIT_SHORT_SHA
      -e CI_COMMIT_BRANCH
      -e CI_PROJECT_DIR
      -e CTEST_JUNIT_FILE
      -e SENTRY_KEY
      "$LINUX_IMAGE"
      bash -lc 'export PATH="/qt/6.11.2/gcc_64/bin:$PREFIX/bin:$PATH";
      export CMAKE_PREFIX_PATH="$PREFIX:$CMAKE_PREFIX_PATH";
      tools/ci/build.sh;
      tools/test.sh all'
  artifacts:
    when: always
    reports:
      junit: build/ctest-junit.xml
    paths:
      - build/ctest-junit.xml

linux-x86_64:build-appimage:
  extends:
    - .linux-x86_64
  stage: build
  variables:
    AFTER_SCRIPT_IGNORE_ERRORS: "false"
  script:
    - docker pull "$LINUX_IMAGE"
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      -e CI_COMMIT_REF_NAME
      -e CI_COMMIT_SHORT_SHA
      -e CI_COMMIT_BRANCH
      -e CI_PROJECT_DIR
      -e SENTRY_KEY
      -e SENTRY_PROJECT
      "$LINUX_IMAGE"
      bash -lc 'export PATH="/qt/6.11.2/gcc_64/bin:$PREFIX/bin:$PATH";
      export CMAKE_PREFIX_PATH="$PREFIX:$CMAKE_PREFIX_PATH";
      export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct);
      git ls-files -z | xargs -0 touch -d @$SOURCE_DATE_EPOCH;
      tools/ci/build.sh;
      mv build/blockstream .;
      mkdir -p symbols && cp blockstream symbols/;
      tools/appimage.sh --plugin-qt "$CI_PROJECT_DIR";
      mkdir linux-x86_64;
      mv Blockstream-x86_64.AppImage linux-x86_64/'
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - linux-x86_64/Blockstream-x86_64.AppImage
      - symbols/

linux-x86_64:symbols:
  extends:
    - .linux-x86_64
    - .upload-symbols
  needs:
    - job: linux-x86_64:build-appimage
      artifacts: true
  script:
    - tools/ci/sentry-upload.sh symbols
    # symbols/ only carries the unstripped blockstream binary. Qt and the other
    # bundled libraries ship inside the AppImage, and without their unwind info
    # Sentry can neither walk nor symbolicate the Qt frames of a Linux minidump,
    # so extract and upload those too. Extracting the AppImage instead of keeping
    # a copy of the AppDir in the build artifacts keeps every pipeline's artifacts
    # small; running it after the binary upload keeps that upload unaffected if
    # extraction ever breaks.
    - chmod +x linux-x86_64/Blockstream-x86_64.AppImage
    - (cd linux-x86_64 && ./Blockstream-x86_64.AppImage --appimage-extract > /dev/null)
    - tools/ci/sentry-upload.sh linux-x86_64/squashfs-root/usr
