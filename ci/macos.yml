.macos:
  variables:
    HOST: "macos"
    MACOSX_DEPLOYMENT_TARGET: 12.0
    SHA256SUM: "shasum -a 256"
    QT_VERSION: "6.12.0"
    QT_WEBENGINE_ID: "6120.61400"

.macos:staple:
  tags:
    - osxsigner
  stage: staple
  rules:
    - if: '$CI_COMMIT_REF_NAME =~ /^release_.*$/'
      when: on_success
    - when: manual
