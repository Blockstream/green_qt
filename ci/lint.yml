commitlint:
  image: commitlint/commitlint
  tags:
    - k8s
  stage: lint
  variables:
    GIT_DEPTH: 0
  allow_failure: true
  script:
    - BASE=${CI_MERGE_REQUEST_DIFF_BASE_SHA:-$(git merge-base HEAD origin/dev)}
    - commitlint --verbose --from "$BASE"

cpplint:
  image: python:3
  tags:
    - k8s
  stage: lint
  allow_failure: true
  script:
    - pip install cpplint
    - ./tools/lint/cpplint.sh

qmllint:
  extends:
    - .gar_wif
    - .release_images_prepare
  tags:
    - cloud
  stage: lint
  allow_failure: true
  variables:
    LINUX_IMAGE: $GAR/green_qt/linux-x86_64@sha256:0067e1fbe0fb9e0716b4cefd876bcc5e6bf636e53a5ecfd54f52ea5c92f1a46c
  script:
    - docker pull "$LINUX_IMAGE"
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      "$LINUX_IMAGE"
      bash -lc 'export PATH="/qt/6.12.0/gcc_64/bin:$PATH";
      qmllint --version;
      tools/lint/qmllint.sh'
