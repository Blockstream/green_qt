.macos-arm64:
  extends:
    - .macos
  variables:
    PREFIX: "$CI_PROJECT_DIR/depends/macos-arm64"
    ARCH: "arm64"
    PKG_CONFIG_PATH: "$PREFIX/lib/pkgconfig"
    CMAKE_INSTALL_PREFIX: "$PREFIX"
  before_script:
    - export BREW_PREFIX="/opt/homebrew"
    - export PATH="$PREFIX/bin:$PATH"
    - export PATH="$HOME/qt-install/6.11.1/macos/bin/:$PATH"
    - export CMAKE_PREFIX_PATH="$PREFIX/lib/aarch64-apple-darwin:$PREFIX/lib/cmake"
  tags:
    - macos-arm64

macos-arm64:depends:
  stage: depends
  extends:
    - .macos-arm64
  cache:
    - key: macos_arm64
      paths:
        - depends/
      policy: push
  script:
    - export
    - tools/buildkdsingleapplication.sh
    - tools/buildlibserialport.sh --disable-shared
    - tools/buildlibusb.sh
    - tools/buildhidapi.sh
    - tools/buildcountly.sh
    - tools/buildzxing.sh
    - tools/buildsentry.sh
    - tools/buildgpgme.sh
    - tools/buildleveldb.sh
    - tools/buildlwk.sh
    - tools/buildglsdk.sh --verbose
    - export LLVM_PATH="$BREW_PREFIX/opt/llvm@17"
    - export PATH="$LLVM_PATH/bin:$PATH"
    - export CC="$LLVM_PATH/bin/clang"
    - export CXX="$LLVM_PATH/bin/clang++"
    - export LDFLAGS="-L$LLVM_PATH/lib"
    - export CPPFLAGS="-I$LLVM_PATH/include"
    - export CMAKE_PREFIX_PATH="$LLVM_PATH"
    - export CMAKE_C_COMPILER="$LLVM_PATH/bin/clang"
    - export CMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++"
    - tools/buildgdk.sh --static
  when: manual

macos-arm64:build:
  extends:
    - .build
    - .macos-arm64
  cache:
    - key: macos_arm64
      paths:
        - depends/
      policy: pull
  after_script:
    - $HOME/qt-install/6.11.1/macos/bin/macdeployqt build/Blockstream.app -qmldir=qml
    - cp "$PREFIX/bin/crashpad_handler" build/Blockstream.app/Contents/MacOS/
    # keep the .dSYM (dsymutil output) for the symbols upload job instead of deleting it
    - mkdir -p symbols && mv build/Blockstream.app/Contents/MacOS/Blockstream.dSYM symbols/
    - mkdir macos-arm64
    - mv build/Blockstream.app macos-arm64
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - macos-arm64/Blockstream.app
      - symbols/

macos-arm64:symbols:
  extends:
    - .macos-arm64
    - .upload-symbols:unix
  needs:
    - job: macos-arm64:build
      artifacts: true
  variables:
    SYMBOLS_PATH: symbols

macos-arm64:staple:
  extends:
    - .macos:staple
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: always
    paths:
      - macos-arm64/Blockstream.dmg
  needs:
    - job: macos-arm64:build
      optional: true
  script:
    - mv macos-arm64/Blockstream.app Blockstream.app
    - tools/macos-thin.sh Blockstream.app arm64
    - tools/macos-staple.sh Blockstream.app
    - tools/packdmg.sh Blockstream.app
    - tools/macos-staple.sh Blockstream.dmg
    - mv Blockstream.dmg macos-arm64/
