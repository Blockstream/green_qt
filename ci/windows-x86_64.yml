windows-x86_64:build-gdk:
  extends: .docker_build
  variables:
    IMAGE: $GAR/green_qt/windows-x86_64
    DOCKER_FILE: ci/windows-x86_64/Dockerfile
  script:
    - docker pull ${IMAGE}:latest || true
    - >
      docker build --network=host --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from ${IMAGE}:latest -t ${IMAGE}:$CI_COMMIT_SHA -t ${IMAGE}:latest
      -f ${DOCKER_FILE} . --progress=plain &>docker-build.log
    - tail -n 1000 docker-build.log
    - id=$(docker create ${IMAGE}:$CI_COMMIT_SHA)
    - docker cp $id:/depends depends
    - docker rm $id
    - docker push ${IMAGE}:${CI_COMMIT_SHA}
    - if [ ${CI_COMMIT_BRANCH} == "master" ]; then docker push ${IMAGE}:latest; fi
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - depends
      - docker-build.log

.windows_gar_wif:
  extends:
    - .gcp_wif_variables
    - .gcp_wif_id_token
  before_script:
    - pwsh -NoProfile -File tools/ci/gcp-wif-docker-login.ps1

windows-x86_64:build-image:
  extends: .windows_gar_wif
  stage: depends
  image: docker:27
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure
  variables:
    DOCKER_BUILDKIT: 0
    DOCKER_DRIVER: null
    DOCKER_HOST: null
    GIT_CLEAN_FLAGS: -ffdx
  needs:
    - windows-x86_64:build-gdk
  tags:
    - windows
  script:
    - xcopy depends ci\x64-windows\depends /E /I /H /Y
    - dir ci\x64-windows\depends
    # docker build context is ci\x64-windows, so stage the patches there
    - xcopy tools\patches ci\x64-windows\patches /E /I /H /Y
    - docker pull "${env:GAR}/green_qt/x64-windows:latest"
    - docker build ci\x64-windows --build-arg "QT_INSTALLER_JWT_TOKEN=${env:QT_INSTALLER_JWT_TOKEN}" -t "${env:GAR}/green_qt/x64-windows:${env:CI_COMMIT_SHA}" -t "${env:GAR}/green_qt/x64-windows:latest"
    - docker push "${env:GAR}/green_qt/x64-windows:${env:CI_COMMIT_SHA}"
    - docker push "${env:GAR}/green_qt/x64-windows:latest"

windows-x86_64:build:
  extends: .windows_gar_wif
  stage: build
  tags:
    - windows
  variables:
    DOCKER_BUILDKIT: 0
    DOCKER_DRIVER: null
    DOCKER_HOST: null
    GIT_CLEAN_FLAGS: -ffdx
    IMAGE: $GAR/green_qt/x64-windows@sha256:3952e77eacbdd2e9b7a2b2b9cf3df4d5e20c7e4761254253cc48008a19a489c3
  script:
    - if (-not (docker image inspect $env:IMAGE 2>$null)) { docker pull $env:IMAGE }
    - docker run --rm -v "${env:CI_PROJECT_DIR}:C:\src" -e CI_COMMIT_REF_NAME -e CI_COMMIT_SHORT_SHA -e CI_COMMIT_BRANCH -e SENTRY_KEY $env:IMAGE cmd /c C:\src\build.bat
    - curl.exe -fsSL "https://release-registry.services.sentry.io/apps/sentry-cli/latest?response=download&arch=x86_64&platform=Windows&package=sentry-cli" -o sentry-cli.exe
    - .\sentry-cli.exe --url https://sentry.blockstream.io debug-files upload --org $SENTRY_ORG --project $SENTRY_PROJECT --auth-token=$SENTRY_AUTH_TOKEN --log-level=$SENTRY_LOG_LEVEL bld\RelWithDebInfo
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - bld/installer.iss
      - bld/RelWithDebInfo

windows-x86_64:sign:
  extends: .gar_wif
  variables:
    GIT_STRATEGY: none
  tags:
    - cloud
  needs:
    - windows-x86_64:build
  script:
    - docker pull "$GAR/green_qt/codesigntool:latest"
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      -e SSL_COM_CREDENTIAL_ID
      -e SSL_COM_USERNAME
      -e SSL_COM_PASSWORD
      -e SSL_COM_TOTP_SECRET
      "$GAR/green_qt/codesigntool:latest"
      bash -c 'set -e; bash CodeSignTool.sh sign
      -credential_id="$SSL_COM_CREDENTIAL_ID"
      -username="$SSL_COM_USERNAME"
      -password="$SSL_COM_PASSWORD"
      -totp_secret="$SSL_COM_TOTP_SECRET"
      -input_file_path=bld/RelWithDebInfo/blockstream.exe
      -override;
      bash CodeSignTool.sh sign
      -credential_id="$SSL_COM_CREDENTIAL_ID"
      -username="$SSL_COM_USERNAME"
      -password="$SSL_COM_PASSWORD"
      -totp_secret="$SSL_COM_TOTP_SECRET"
      -input_file_path=bld/RelWithDebInfo/crashpad_handler.exe
      -override;
      bash CodeSignTool.sh sign
      -credential_id="$SSL_COM_CREDENTIAL_ID"
      -username="$SSL_COM_USERNAME"
      -password="$SSL_COM_PASSWORD"
      -totp_secret="$SSL_COM_TOTP_SECRET"
      -input_file_path=bld/RelWithDebInfo/crashpad_wer.dll
      -override;
      find bld -type f \( -iname "*.exe" -o -iname "*.dll" \) -exec echo bash CodeSignTool.sh sign
      -credential_id="$SSL_COM_CREDENTIAL_ID"
      -username="$SSL_COM_USERNAME"
      -password="$SSL_COM_PASSWORD"
      -totp_secret="$SSL_COM_TOTP_SECRET"
      -input_file_path={}
      -override \;'
  stage: staple
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - bld/installer.iss
      - bld/RelWithDebInfo

windows-x86_64:installer:
  image:
    name: amake/innosetup@sha256:e003376ba818547275fe10c95e2a29be0f2d12d45e9eb8f205b6672dc5685bb1
    entrypoint: [""]
  stage: installer
  tags:
    - ga
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: always
    paths:
      - Setup.exe
  needs:
    - windows-x86_64:sign
  script:
    - mv bld/installer.iss bld/RelWithDebInfo/
    - cp assets/installer/* bld/RelWithDebInfo/
    - iscc bld/RelWithDebInfo/installer.iss
    - mv bld/RelWithDebInfo/Setup.exe .

.windows:sign:
  extends: .gar_wif
  variables:
    GIT_STRATEGY: none
  tags:
    - cloud
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure
  script:
    - docker pull "$GAR/green_qt/codesigntool:latest"
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      -e SSL_COM_CREDENTIAL_ID
      -e SSL_COM_USERNAME
      -e SSL_COM_PASSWORD
      -e SSL_COM_TOTP_SECRET
      -e INPUT_FILE
      -e OUTPUT_FILE
      "$GAR/green_qt/codesigntool:latest"
      bash -c 'set -e; mkdir -p signed;
      bash CodeSignTool.sh sign
      -credential_id="$SSL_COM_CREDENTIAL_ID"
      -username="$SSL_COM_USERNAME"
      -password="$SSL_COM_PASSWORD"
      -totp_secret="$SSL_COM_TOTP_SECRET"
      -output_dir_path=signed
      -input_file_path="$INPUT_FILE";
      mv "signed/$INPUT_FILE" "$OUTPUT_FILE"'

windows-x86_64:sign-installer:
  extends: .windows:sign
  stage: installer
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: always
    paths:
      - BlockstreamSetup.exe
  needs:
    - windows-x86_64:installer
  variables:
    INPUT_FILE: Setup.exe
    OUTPUT_FILE: BlockstreamSetup.exe
