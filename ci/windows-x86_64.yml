# Cross-compiles GDK and libserialport for Windows with MinGW. Nothing needs this job:
# windows-x86_64:build-image takes the same tree from windows-x86_64:depends instead, so
# the Windows image can be rebuilt without recompiling GDK.
# To bump GDK: edit GDK_COMMIT in tools/buildgdk.sh, run this job, then set IMAGE in
# windows-x86_64:depends to the digest pushed here (same @sha256: pinning convention as
# ci/linux-x86_64.yml and ci/lint.yml).
windows-x86_64:build-with-mingw:
  extends: .docker_build
  variables:
    IMAGE: $GAR/green_qt/windows-x86_64
    DOCKER_FILE: ci/windows-x86_64/Dockerfile
  script:
    - docker pull ${IMAGE}:latest || true
    - >
      docker build --network=host --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from ${IMAGE}:latest -t ${IMAGE}:$CI_COMMIT_SHA -t ${IMAGE}:latest
      -f ${DOCKER_FILE} . --progress=plain &>docker-build.log
    - tail -n 1000 docker-build.log
    - docker push ${IMAGE}:${CI_COMMIT_SHA}
    - if [ "${CI_COMMIT_BRANCH}" == "${CI_DEFAULT_BRANCH}" ]; then docker push ${IMAGE}:latest; fi
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - docker-build.log

# Extracts the MinGW-built GDK/libserialport tree from the last published windows-x86_64
# image, so windows-x86_64:build-image gets its depends without a GDK rebuild. Runs on a
# linux runner: the windows runner's docker daemon is in windows-container mode and cannot
# create a container from this image.
windows-x86_64:depends:
  extends: .gar_wif
  stage: depends
  needs: []
  when: manual
  tags:
    - cloud
  variables:
    IMAGE: $GAR/green_qt/windows-x86_64@sha256:2098cff8474a6a03f483515429898a77931fc759bf0230263b7ac0d1d00723cc
  script:
    - docker pull "$IMAGE"
    - id=$(docker create "$IMAGE")
    - docker cp $id:/depends depends
    - docker rm $id
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - depends

.windows_gar_wif:
  extends:
    - .gcp_wif_variables
    - .gcp_wif_id_token
  before_script:
    - pwsh -NoProfile -File tools/ci/gcp-wif-docker-login.ps1

windows-x86_64:build-image:
  extends: .windows_gar_wif
  stage: depends
  image: docker:27
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure
  variables:
    DOCKER_BUILDKIT: 0
    DOCKER_DRIVER: null
    DOCKER_HOST: null
    GIT_CLEAN_FLAGS: -ffdx
  needs:
    - windows-x86_64:depends
  tags:
    - windows
  script:
    - xcopy depends ci\x64-windows\depends /E /I /H /Y
    - dir ci\x64-windows\depends
    # docker build context is ci\x64-windows, so stage the patches there
    - xcopy tools\patches ci\x64-windows\patches /E /I /H /Y
    - docker pull "${env:GAR}/green_qt/x64-windows:latest"
    - docker build ci\x64-windows --build-arg "QT_INSTALLER_JWT_TOKEN=${env:QT_INSTALLER_JWT_TOKEN}" -t "${env:GAR}/green_qt/x64-windows:${env:CI_COMMIT_SHA}" -t "${env:GAR}/green_qt/x64-windows:latest"
    - docker push "${env:GAR}/green_qt/x64-windows:${env:CI_COMMIT_SHA}"
    - docker push "${env:GAR}/green_qt/x64-windows:latest"

windows-x86_64:build:
  extends: .windows_gar_wif
  stage: build
  tags:
    - windows
  variables:
    DOCKER_BUILDKIT: 0
    DOCKER_DRIVER: null
    DOCKER_HOST: null
    GIT_CLEAN_FLAGS: -ffdx
    IMAGE: $GAR/green_qt/x64-windows@sha256:869ec7c23561a07243df039cdd2eae2b0866de0b16860c7347820dfb5da75632
  script:
    - if (-not (docker image inspect $env:IMAGE 2>$null)) { docker pull $env:IMAGE }
    - docker run --rm -v "${env:CI_PROJECT_DIR}:C:\src" -e CI_COMMIT_REF_NAME -e CI_COMMIT_SHORT_SHA -e CI_COMMIT_BRANCH -e SENTRY_KEY -e SENTRY_PROJECT $env:IMAGE cmd /c C:\src\build.bat
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - bld/installer.iss
      - bld/RelWithDebInfo

windows-x86_64:symbols:
  extends: .upload-symbols
  tags:
    - windows
  # The repository is needed for tools/ci/sentry-upload.ps1, so no GIT_STRATEGY: none here.
  needs:
    - job: windows-x86_64:build
      artifacts: true
  script:
    - pwsh -NoProfile -File tools/ci/sentry-upload.ps1 bld\RelWithDebInfo

windows-x86_64:sign:
  extends: .windows:sign
  needs:
    - windows-x86_64:build
  variables:
    INPUT_FILES: >-
      bld/RelWithDebInfo/blockstream.exe
      bld/RelWithDebInfo/crashpad_handler.exe
      bld/RelWithDebInfo/crashpad_wer.dll
      bld/RelWithDebInfo/libgreen_gdk.dll
      bld/RelWithDebInfo/libserialport-0.dll
  stage: staple
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - bld/installer.iss
      - bld/RelWithDebInfo

windows-x86_64:installer:
  image:
    name: amake/innosetup@sha256:e003376ba818547275fe10c95e2a29be0f2d12d45e9eb8f205b6672dc5685bb1
    entrypoint: [""]
  stage: installer
  tags:
    - ga
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: always
    paths:
      - BlockstreamSetup-x86_64.exe
  needs:
    - windows-x86_64:sign
  script:
    - mv bld/installer.iss bld/RelWithDebInfo/
    - cp assets/installer/* bld/RelWithDebInfo/
    - iscc bld/RelWithDebInfo/installer.iss
    - mv bld/RelWithDebInfo/Setup.exe BlockstreamSetup-x86_64.exe

.windows:sign:
  extends: .gar_wif
  variables:
    GIT_STRATEGY: none
  tags:
    - cloud
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure
  script:
    - docker pull "$GAR/green_qt/codesigntool@sha256:fe8852ba0f2ca61ed4fcc2aaa5b1569c2cf2432839aa9743297b464610f035eb"
    - >-
      docker run --rm
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      -e SSL_COM_CREDENTIAL_ID
      -e SSL_COM_USERNAME
      -e SSL_COM_PASSWORD
      -e SSL_COM_TOTP_SECRET
      -e INPUT_FILES
      "$GAR/green_qt/codesigntool@sha256:fe8852ba0f2ca61ed4fcc2aaa5b1569c2cf2432839aa9743297b464610f035eb"
      bash -c 'set -e;
      for f in $INPUT_FILES; do
      test -f "$f" || { echo "expected to sign $f but it does not exist"; exit 1; };
      echo "Signing $f";
      bash CodeSignTool.sh sign
      -credential_id="$SSL_COM_CREDENTIAL_ID"
      -username="$SSL_COM_USERNAME"
      -password="$SSL_COM_PASSWORD"
      -totp_secret="$SSL_COM_TOTP_SECRET"
      -input_file_path="$f"
      -override;
      done'

windows-x86_64:sign-installer:
  extends: .windows:sign
  stage: installer
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: on_success
    paths:
      - BlockstreamSetup-x86_64.exe
  needs:
    - windows-x86_64:installer
  variables:
    INPUT_FILES: BlockstreamSetup-x86_64.exe
