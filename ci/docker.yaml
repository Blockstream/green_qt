.gar_wif:
  extends:
    - .gcp_wif_variables
    - .gcp_wif_id_token
  image: blockstream/gcloud-docker:502.0.0-27.3
  services:
    - docker:27-dind
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - test -n "$GAR" && test -n "$GAR_SERVICE_ACCOUNT_EMAIL"
    - !reference [.gcp_wif_login_script]
    - gcloud auth configure-docker "${GAR%%/*}" --quiet

.docker_build_base:
  extends: .gar_wif
  needs: []
  retry:
    max: 2
    when:
      - runner_system_failure
      - unknown_failure
      - stuck_or_timeout_failure
  stage: depends
  tags:
    - cloud

docker_codesigntool:
  extends: .docker_build_base
  script:
    - docker build
      --network=host
      --cache-from=$GAR/green_qt/codesigntool:latest
      -t $GAR/green_qt/codesigntool:latest
      -f ci/codesigntool/Dockerfile
      .
    - docker push $GAR/green_qt/codesigntool:latest
  rules:
    - changes:
        - ci/codesigntool/**/*
  when: manual

.docker_build:
  extends: .docker_build_base
  when: manual
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_BUILDKIT: 1
    DOCKER_BUILD_ARGS: ""
    BUILDX_GIT_INFO: false
    DOCKER_FILE: Dockerfile
    DOCKER_PATH: .
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker pull ${IMAGE}:latest || true
    - >
      docker build
      --network=host
      --build-arg BUILDKIT_INLINE_CACHE=1
      --cache-from ${IMAGE}:latest
      ${DOCKER_BUILD_ARGS}
      -t ${IMAGE}:$CI_COMMIT_SHA
      -t ${IMAGE}:latest
      -f ${DOCKER_FILE}
      ${DOCKER_PATH}
      --progress=plain &>docker-build.log
    - tail -n 1000 docker-build.log
    - docker push ${IMAGE}:${CI_COMMIT_SHA}
    - if [ ${CI_COMMIT_BRANCH} == "master" ]; then docker push ${IMAGE}:latest; fi
  artifacts:
    name: "$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 hour
    when: always
    paths:
    - docker-build.log
