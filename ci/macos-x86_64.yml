.macos-x86_64:
  extends:
    - .macos
  variables:
    PREFIX: "$CI_PROJECT_DIR/depends/macos-x86_64"
    ARCH: "x86_64"
    PKG_CONFIG_PATH: "$PREFIX/lib/pkgconfig"
    CMAKE_INSTALL_PREFIX: "$PREFIX"
  before_script:
    - export BREW_PREFIX="/usr/local"
    - export PATH="$PREFIX/bin:$PATH"
    - export PATH="$HOME/qt-install/6.11.1/macos/bin/:$PATH"
    - export CMAKE_PREFIX_PATH="$PREFIX/lib/x86_64-apple-darwin:$PREFIX/lib/cmake"
  tags:
    - macos-x86_64

macos-x86_64:depends:
  stage: depends
  extends:
    - .macos-x86_64
  cache:
    - key: macos_x86_64
      paths:
        - depends/
      policy: push
  script:
    - tools/buildkdsingleapplication.sh
    - tools/buildlibserialport.sh --disable-shared
    - tools/buildlibusb.sh
    - tools/buildhidapi.sh
    - tools/buildcountly.sh
    - tools/buildzxing.sh
    - tools/buildsentry.sh
    - tools/buildgpgme.sh
    - tools/buildleveldb.sh
    - tools/buildlwk.sh
    - tools/buildglsdk.sh --verbose
    - export LLVM_PATH="$BREW_PREFIX/opt/llvm@17"
    - export PATH="$LLVM_PATH/bin:$PATH"
    - export CC="$LLVM_PATH/bin/clang"
    - export CXX="$LLVM_PATH/bin/clang++"
    - export LDFLAGS="-L$LLVM_PATH/lib"
    - export CPPFLAGS="-I$LLVM_PATH/include"
    - export CMAKE_PREFIX_PATH="$LLVM_PATH"
    - export CMAKE_C_COMPILER="$LLVM_PATH/bin/clang"
    - export CMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++"
    - tools/buildgdk.sh --static
  when: manual

macos-x86_64:build:
  extends:
    - .build
    - .macos-x86_64
  cache:
    - key: macos_x86_64
      paths:
        - depends/
      policy: pull
  after_script:
    - $HOME/qt-install/6.11.1/macos/bin/macdeployqt build/Blockstream.app -qmldir=qml
    - cp "$PREFIX/bin/crashpad_handler" build/Blockstream.app/Contents/MacOS/
    # keep the .dSYM (dsymutil output) for the symbols upload job instead of deleting it
    - mkdir -p symbols && mv build/Blockstream.app/Contents/MacOS/Blockstream.dSYM symbols/
    - mkdir macos-x86_64
    - mv build/Blockstream.app macos-x86_64
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    paths:
      - macos-x86_64/Blockstream.app
      - symbols/

macos-x86_64:symbols:
  extends:
    - .macos-x86_64
    - .upload-symbols
  needs:
    - job: macos-x86_64:build
      artifacts: true
  script:
    - tools/ci/sentry-upload.sh symbols
    # symbols/ only carries the app's own dSYM. Qt and the other bundled libraries ship
    # inside Blockstream.app, and without their debug info Sentry can neither walk nor
    # symbolicate the Qt frames of a macOS minidump: the leaf frame resolves to whatever
    # exported symbol happens to be nearest, which also splits one crash across several
    # issues. Scanning the whole bundle rather than Contents/Frameworks alone covers the
    # Mach-O binaries macdeployqt writes elsewhere too - the plugins under Contents/PlugIns,
    # the cocoa platform plugin among them, and the QML module plugins under
    # Contents/Resources - and keeps working if a future macdeployqt moves things again;
    # sentry-cli walks the tree and skips whatever is not an object file. Running it after
    # the dSYM upload keeps that upload unaffected if scanning the bundle ever breaks.
    - tools/ci/sentry-upload.sh macos-x86_64/Blockstream.app/Contents

macos-x86_64:staple:
  extends:
    - .macos:staple
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 1 week
    when: always
    paths:
      - macos-x86_64/Blockstream.dmg
  needs:
    - job: macos-x86_64:build
      optional: true
  script:
    - mv macos-x86_64/Blockstream.app Blockstream.app
    - tools/macos-thin.sh Blockstream.app x86_64
    - tools/macos-staple.sh Blockstream.app
    - tools/packdmg.sh Blockstream.app
    - tools/macos-staple.sh Blockstream.dmg
    - mv Blockstream.dmg macos-x86_64/
